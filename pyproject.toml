[project]
name = "altotec"
version = "0.1.0"
description = "AltoTec: tienda online de equipos POS de CODALTO"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106", "S107"]
"config/settings/test.py" = ["S105", "F405"]
"config/settings/*" = ["F405"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
