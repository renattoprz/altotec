name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only
      - name: Pruebas
        run: pytest
      - name: Revisión de despliegue de Django
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-only-0123456789abcdefghijklmnopqrstuvwxyzABCDEF
          DJANGO_ALLOWED_HOSTS: tec.codaltoperu.com

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit pip-audit
      - name: Análisis estático (Bandit)
        run: bandit -r apps config -c pyproject.toml
      - name: Dependencias vulnerables (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
